name: Build PS2 Game Slim

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest 
    
    steps:
    - name: Ambil kode
      uses: actions/checkout@v4

    - name: Compile game
      run: |
        $PS2DEV/ee/bin/mips64r5900el-ps2-elf-gcc -D_EE -O2 -G0 -Wall -I$PS2SDK/ee/include -I$PS2SDK/common/include -I$GSKIT/include -c main.c -o main.o
        $PS2DEV/ee/bin/mips64r5900el-ps2-elf-gcc -L$PS2SDK/ee/lib -L$GSKIT/lib -o ulartangga_slim.elf main.o -lgskit -ldmakit -lpad -lmc -laudsrv -lkernel -lc -lm

    - name: Upload file ELF
      uses: actions/upload-artifact@v4
      with:
        name: Game-Ular-Tangga-PS2-Slim
        path: ulartangga_slim.elf
