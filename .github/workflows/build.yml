name: Build PS2 Game Slim

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest 
    
    steps:
    - name: Ambil kode
      uses: actions/checkout@v4

    - name: Cari lokasi gsKit
      run: |
        echo "PS2DEV=$PS2DEV PS2SDK=$PS2SDK GSKIT=$GSKIT"
        ls $PS2SDK
        find /usr/local/ps2dev -maxdepth 5 -name "gsKit.h" 2>/dev/null
        find /usr/local/ps2dev -maxdepth 5 -name "libgskit.a" 2>/dev/null

    - name: Compile game
      run: |
        $PS2DEV/ee/bin/mips64r5900el-ps2-elf-gcc -H -D_EE -O2 -G0 -Wall -I$PS2SDK/ee/include -I$PS2SDK/common/include -I$PS2SDK/ports/include -I$GSKIT/include -I$GSKIT/ee/include -I$GSKIT/ee -I/usr/local/ps2dev/gsKit/include -I/usr/local/ps2dev/gsKit/ee/include -c main.c -o main.o
        $PS2DEV/ee/bin/mips64r5900el-ps2-elf-gcc -L$PS2SDK/ee/lib -L$PS2SDK/ports/lib -L$GSKIT/lib -L/usr/local/ps2dev/gsKit/lib -o ulartangga_slim.elf main.o -lgskit -ldmakit -lpad -lkernel -lc -lm

    - name: Upload file ELF
      uses: actions/upload-artifact@v4
      with:
        name: Game-Ular-Tangga-PS2-Slim
        path: ulartangga_slim.elf
